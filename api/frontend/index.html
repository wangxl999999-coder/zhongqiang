<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API接口平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .hero p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.8;
        }
        
        .hero-buttons {
            display: flex;
            gap: 15px;
        }
        
        .hero-btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .hero-btn-primary {
            background: white;
            color: #667eea;
        }
        
        .hero-btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid white;
        }
        
        .hero-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }
        
        .feature-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }
        
        .feature-card .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        
        .feature-card h3 {
            margin-bottom: 10px;
        }
        
        .feature-card p {
            opacity: 0.8;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>🚀 专业API接口平台</h1>
        <p>提供稳定、高效的数据接口服务，支持淘宝、天猫商品详情采集。注册即送10金币，推广享10%返利。</p>
        <div class="hero-buttons">
            <a href="register.html" class="hero-btn hero-btn-primary">立即注册</a>
            <a href="login.html" class="hero-btn hero-btn-secondary">登录账号</a>
        </div>
    </div>
    
    <div class="features">
        <div class="feature-card">
            <div class="icon">🔑</div>
            <h3>简单易用</h3>
            <p>注册获取API_KEY，一键调用，无需复杂配置</p>
        </div>
        <div class="feature-card">
            <div class="icon">💰</div>
            <h3>按量计费</h3>
            <p>每次调用1金币，1元=100金币，充值即得</p>
        </div>
        <div class="feature-card">
            <div class="icon">📦</div>
            <h3>数据采集</h3>
            <p>支持淘宝、天猫商品详情采集，返回JSON格式</p>
        </div>
        <div class="feature-card">
            <div class="icon">🎁</div>
            <h3>推广返利</h3>
            <p>邀请好友注册充值，享受10%返利奖励</p>
        </div>
    </div>
    
    <script src="/static/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (auth.isLoggedIn()) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
