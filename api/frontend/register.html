<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - API接口平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>✨ 注册</h1>
            <p class="subtitle">创建账户，立即获得10金币</p>
            
            <div id="alert"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱" required>
                </div>
                
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码（至少6位）" required minlength="6">
                </div>
                
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入密码" required>
                </div>
                
                <div class="form-group">
                    <label>推荐码（选填）</label>
                    <input type="text" id="referralCode" placeholder="如果有人推荐您，请填写推荐码">
                </div>
                
                <button type="submit" class="btn btn-primary">注册</button>
            </form>
            
            <div class="auth-footer">
                已有账户？<a href="login.html">立即登录</a>
            </div>
        </div>
    </div>
    
    <script src="/static/js/api.js"></script>
    <script>
        function showAlert(message, type = 'error') {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            auth.redirectIfLoggedIn();
            
            const urlParams = new URLSearchParams(window.location.search);
            const ref = urlParams.get('ref');
            if (ref) {
                document.getElementById('referralCode').value = ref;
            }
            
            document.getElementById('registerForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const referralCode = document.getElementById('referralCode').value;
                
                if (password !== confirmPassword) {
                    showAlert('两次输入的密码不一致');
                    return;
                }
                
                if (password.length < 6) {
                    showAlert('密码长度至少为6位');
                    return;
                }
                
                try {
                    await api.register(username, email, password, referralCode);
                    window.location.href = 'login.html?registered=true';
                } catch (error) {
                    showAlert(error.message);
                }
            });
        });
    </script>
</body>
</html>
