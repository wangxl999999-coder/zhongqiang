<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background: #f0f2f5;">
    <div class="content">
        <div class="welcome-stats">
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">学生总数</div>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">教师总数</div>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">试题总数</div>
            </div>
            <div class="stat-card">
                <div class="number">0</div>
                <div class="label">考试总数</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">系统说明</h3>
            </div>
            <div class="card-body">
                <p>欢迎使用在线考试系统！本系统包含以下功能模块：</p>
                <br>
                <ul style="padding-left: 20px; line-height: 2;">
                    <li><strong>用户管理</strong>：管理学生、教师、管理员账号，支持批量生成账号</li>
                    <li><strong>角色管理</strong>：配置系统角色和权限</li>
                    <li><strong>年级班级</strong>：管理年级和班级信息</li>
                    <li><strong>学科管理</strong>：管理学科、章节、知识点</li>
                    <li><strong>题库管理</strong>：支持多种题型，支持批量导入、查重、审核</li>
                    <li><strong>试卷管理</strong>：支持手动组卷、随机组卷，支持预览复制</li>
                    <li><strong>考试安排</strong>：创建考试、设置参考人员、定时发布、延期等</li>
                </ul>
                <br>
                <p style="color: #666;">默认管理员账号：admin / admin</p>
            </div>
        </div>
    </div>
</body>
</html>
